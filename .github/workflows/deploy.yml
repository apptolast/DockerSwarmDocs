name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages@v5 (its own latest release, no newer version
      # exists that fixes this - checked github.com/actions/deploy-pages
      # releases) internally emits a Node.js runtime deprecation warning
      # for the built-in `punycode` module (DEP0040), from inside the
      # action's own bundled dependencies - not something in this repo's
      # code or config. NODE_OPTIONS=--no-deprecation is confirmed
      # settable via the environment per Node's own docs
      # (nodejs.org/api/cli.html#node_optionsoptions) and silences it.
      # Trade-off, stated plainly: this suppresses ALL deprecation
      # warnings for this one step's Node process, not just punycode -
      # acceptable here since the step is a single third-party action
      # with a single known warning source, but worth revisiting if
      # actions/deploy-pages ever needs a different deprecation surfaced.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          NODE_OPTIONS: --no-deprecation
