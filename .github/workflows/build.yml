name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  # Este workflow solo verifica que el sitio compila (Astro/Starlight, via
  # `npm run build` -> `astro build`). NO despliega a GitHub Pages: eso lo
  # hace .github/workflows/deploy.yml, que solo se dispara en push a `main`,
  # nunca en pull_request, para que una PR nunca publique contenido sin
  # fusionar (ver README.md).
