name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  # Este workflow solo verifica que el sitio compila. NO despliega a GitHub
  # Pages ni a ningún otro sitio: la publicación es una decisión aparte del
  # propietario del repositorio (ver README.md).
